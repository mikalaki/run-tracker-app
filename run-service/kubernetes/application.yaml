apiVersion: apps/v1
kind: Deployment
metadata:
  name: run-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: run-service
  template:
    metadata:
      labels:
        app: run-service
    spec:
      containers:
        - name: run-service
          image: mikalaki/run-tracker-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_HOST
              value: mongodb-service
            - name: STATISTICS_SERVICE_URL
              value: http://statistics-service:3001

---
apiVersion: v1
kind: Service
metadata:
  name: run-service
spec:
  selector:
    app: run-service
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statistics-service
  template:
    metadata:
      labels:
        app: statistics-service
    spec:
      containers:
        - name: statistics-service
          image: mikalaki/run-statistics-service:latest
          ports:
            - containerPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: statistics-service
spec:
  selector:
    app: statistics-service
  ports:
    - port: 3001
      targetPort: 3001

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017